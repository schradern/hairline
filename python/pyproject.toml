[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hairline"
version = "0.2.0"
description = "Clean, predictable figures for medical and data science, matching the hairline R package."
readme = "README.md"
authors = [{ name = "Nikolas Schrader", email = "hi@nikolasschrader.com" }]
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/hairline/data/fonts/OFL.txt"]
requires-python = ">=3.11"
dependencies = ["cycler>=0.10", "matplotlib>=3.11", "numpy>=1.25", "pandas>=2.0", "pillow>=9", "pyyaml>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/schradern/hairline"
Repository = "https://github.com/schradern/hairline"
Issues = "https://github.com/schradern/hairline/issues"
Documentation = "https://github.com/schradern/hairline#readme"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fonttools>=4.50", "opentype-feature-freezer>=1.32", "pillow>=10"]

[tool.hatch.build.targets.wheel]
packages = ["src/hairline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:hairline"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "T20"]
